<!DOCTYPE html>
<html>
<head>
    <title>2 sentence story, elevator</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="wall">
        <div class="story">
            <p>I pressed the elevator button <br>
                The door opened and the person<br>
                inside was me</p>
        </div>
        <div class="elevator">
            <video id="camera" autoplay playsinline></video>

            <div id="leftDoor" class="door left-door"></div>
            <div id="rightDoor" class="door right-door"></div>
        </div>
        <div class="button-panel">
            <button id="openButton" class="button opens">
                <p>open</p>
            </button>
            <button id="closeButton" class="button close">
                <p>close</p>
            </button>
        </div>
        <!-- <div class="stairs"></div> -->
    </div>
    <script src="script.js"></script>
</body>
</html>
