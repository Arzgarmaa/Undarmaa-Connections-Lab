<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw Together App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Create Your Own Pen Tool & Draw Together 🎨</h1>
  <div id="layout">
    <canvas id="main" width="800" height="500"></canvas>

    <div id="side">
      <!-- Pen Icon Drawing Pad -->
      <strong>Draw Pen Icon Here 🖌️</strong>
      <canvas id="pad" width="200" height="200"></canvas>
      <button id="saveShape">Save icon</button>
      <button id="clearPad">Clear icon pad</button>

      <!-- Brush & Pen Tool Controls -->
      <div>
        <label><input type="radio" name="mode" value="brush" checked> Brush</label>
        <label><input type="radio" name="mode" value="shape"> Pen tool</label>
      </div>

      <label>Brush type
        <select id="brushType">
          <option value="pen">Pen</option>
          <option value="marker">Marker</option>
          <option value="spray">Spray paint</option>
          <option value="dotted">Dotted</option>
          <option value="calligraphy">Calligraphy</option>
        </select>
      </label>

      <label>Size
        <input id="size" type="range" min="4" max="150" value="40">
      </label>

      <!-- RGB Sliders -->
      <strong>Color</strong>
      <label>R <input id="r" class="rgb" type="range" min="0" max="255" value="30"></label>
      <label>G <input id="g" class="rgb" type="range" min="0" max="255" value="120"></label>
      <label>B <input id="b" class="rgb" type="range" min="0" max="255" value="220"></label>
      <div id="preview"></div>

      <!-- Saved Pen Icons -->
      <strong>Saved pen icons:</strong>
      <div id="shapeList"></div>

      <button id="clearAll">Clear whole canvas</button>
      <button id="exportImg">Save / Export Image</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
