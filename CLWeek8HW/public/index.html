<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shape Drawing App</title>
  <style>
    body { font-family: sans-serif; margin: 16px; background: #f4f1ea; }
    #layout { display: flex; gap: 16px; flex-wrap: wrap; }
    canvas { background: white; border: 2px solid #333; touch-action: none; }
    #side { display: flex; flex-direction: column; gap: 10px; width: 220px; }
    .rgb { width: 100%; }
    #r { accent-color: red; }
    #g { accent-color: green; }
    #b { accent-color: blue; }
    #preview { height: 24px; border: 1px solid #333; }
    #shapeList { display: flex; flex-wrap: wrap; gap: 6px; }
    #shapeList canvas { width: 50px; height: 50px; cursor: pointer; border: 2px solid #aaa; }
    #shapeList canvas.selected { border-color: #e03; }
  </style>
</head>
<body>
  <h1>Shape Drawing App</h1>
  <div id="layout">
    <canvas id="main" width="800" height="500"></canvas>

    <div id="side">
      <strong>Color</strong>
      <label>R <input id="r" class="rgb" type="range" min="0" max="255" value="30"></label>
      <label>G <input id="g" class="rgb" type="range" min="0" max="255" value="120"></label>
      <label>B <input id="b" class="rgb" type="range" min="0" max="255" value="220"></label>
      <div id="preview"></div>

      <label>Brush type
        <select id="brushType">
          <option value="pen">Pen</option>
          <option value="marker">Marker</option>
          <option value="spray">Spray paint</option>
          <option value="dotted">Dotted</option>
          <option value="calligraphy">Calligraphy</option>
        </select>
      </label>

      <label>Size
        <input id="size" type="range" min="4" max="150" value="40">
      </label>

      <div>
        <label><input type="radio" name="mode" value="brush" checked> Brush</label>
        <label><input type="radio" name="mode" value="shape"> Shape stamp</label>
      </div>

      <strong>Draw a shape here:</strong>
      <canvas id="pad" width="200" height="200"></canvas>
      <button id="saveShape">Save shape</button>
      <button id="clearPad">Clear pad</button>

      <strong>Saved shapes:</strong>
      <div id="shapeList"></div>

      <button id="clearAll">Clear whole canvas</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
